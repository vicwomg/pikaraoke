# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks


# Exclude binary files and CHANGELOGs that are automanaged
exclude: \.(deb|exe|bat)$|(^|/)(CHANGELOG|bug_report|feature_request)\.md$|^\.claude/agents/

repos:

  # Python tools
  # ----------------------------------------------------------------------------------------------
- repo: https://github.com/hadialqattan/pycln
  rev: v2.6.0
  hooks:
  - id: pycln
    name: Remove Unused Python Imports
    args: [--exclude, conftest.py]

- repo: https://github.com/PyCQA/isort
  rev: 9.0.1
  hooks:
  - id: isort
    name: Sort Python Imports
    args: [--profile=black]

- repo: https://github.com/psf/black
  rev: 26.5.1
  hooks:
  - id: black
    name: Format Python Code
    args: [--line-length, '100', --target-version, py310]

  # Run from the project environment, not an isolated one: pylint infers types
  # through imports, and without the project's dependencies installed it reports
  # 163 spurious import-errors instead of real findings.
- repo: local
  hooks:
  - id: pylint
    name: Lint Python Code
    entry: uv run --group translations pylint --rcfile=code_quality/.pylintrc
    language: system
    types: [python]
    require_serial: true

  # Templates may carry layout but never a colour: colours come from Bulma's variables,
  # configured in custom.css, so a literal here is a second theme that drifts from the first.
- repo: local
  hooks:
  - id: no-template-colour-literals
    name: No Colour Literals in Templates
    language: pygrep
    entry: '(?i)(:\s*(white|black|red|green|blue|yellow|orange|gr[ae]y|silver)\b|#[0-9a-f]{3}\b|#[0-9a-f]{6}\b|\b(rgba?|hsla?)\()'
    files: ^pikaraoke/templates/.*\.html$

- repo: https://github.com/executablebooks/mdformat
  rev: 1.0.0
  hooks:
  - id: mdformat
    name: Format Markdown Files
    additional_dependencies:
    - mdformat-black
    args: [--number, --end-of-line=keep]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
    # Vendored assets and generated catalogs are not ours to reformat.
    exclude: ^pikaraoke/static/|\.pot$
  - id: trailing-whitespace
    name: Trim Trailing Whitespace
    exclude: \.po$
  - id: check-yaml
    name: Check YAML Parseable
  - id: requirements-txt-fixer
    name: Sort requirements.txt
  - id: check-added-large-files
    args: [--maxkb=3000]
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: fix-byte-order-marker
  - id: mixed-line-ending
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
    exclude: .bat
  - id: no-commit-to-branch
    name: No Commit to master
    args: [--branch, master]
